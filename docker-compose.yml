# Local Postgres for the internal prospecting tool.
# Usage:  docker compose up -d   (starts db on localhost:5433)
#         docker compose down     (stop, keeps the named volume / data)
services:
  prospect-db:
    image: postgres:16-alpine
    container_name: juko-prospect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: juko
      POSTGRES_PASSWORD: juko_dev_pw
      POSTGRES_DB: juko_prospect
    ports:
      # Host 5433 → container 5432, to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - prospect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juko -d juko_prospect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prospect_pgdata:
